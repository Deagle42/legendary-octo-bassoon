name: Build ARM64 (slimt + PaddleOCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- slimt ----------
      - name: Build slimt (ARM64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 \
            /bin/bash -c "
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git wget pkg-config ninja-build \
                libopenblas-dev libxsimd-dev xtl-dev libsentencepiece-dev libpcre2-dev \
                libboost-all-dev libprotobuf-dev protobuf-compiler \
                libopencv-dev \
                curl ca-certificates \
                python3 python3-pip \
                libssl-dev

              git clone --recursive https://github.com/jerinphilip/slimt.git
              cd slimt

              find . -name 'CMakeLists.txt' -exec sed -i 's/-Werror//g' {} +
              find . -name '*.cmake' -exec sed -i 's/-Werror//g' {} +

              mkdir -p build && cd build

              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_RUY=ON \
                -DWITH_GEMMOLOGY=OFF \
                -DWITH_INTGEMM=OFF \
                -DUSE_NEON=ON \
                -DUSE_BUILTIN_SENTENCEPIECE=ON \
                -DBLA_VENDOR=OpenBLAS \
                -DCMAKE_CXX_FLAGS='-Wno-error -Wno-comment'

              make -j\$(nproc)

              mkdir -p /workspace/artifacts/slimt
              # Копируем ВСЕ исполняемые файлы из build/
              find . -type f -executable \
                -not -name '*.cmake' \
                -not -name '*.txt' \
                -not -name '*.o' \
                -not -name '*.a' \
                -not -name '*.so*' \
                -exec cp --parents {} /workspace/artifacts/slimt/ \; || true

              echo '--- slimt artifacts ---'
              find /workspace/artifacts/slimt -type f | head -50
            "

      # ---------- rust-paddle-ocr ----------
      - name: Cache Rust (arm64)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            rust-paddle-ocr/target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Build PaddleOCR (ARM64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.cargo:/root/.cargo \
            -w /workspace \
            ubuntu:22.04 \
            /bin/bash -c "
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git wget pkg-config ninja-build \
                libopenblas-dev libxsimd-dev xtl-dev libsentencepiece-dev libpcre2-dev \
                libboost-all-dev libprotobuf-dev protobuf-compiler \
                libopencv-dev \
                curl ca-certificates \
                python3 python3-pip \
                libssl-dev

              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal
              source \$HOME/.cargo/env

              git clone https://github.com/zibo-chen/rust-paddle-ocr.git
              cd rust-paddle-ocr

              echo '=== Cargo metadata: targets ==='
              cargo metadata --no-deps --format-version 1 \
                | python3 -c \"import sys,json; d=json.load(sys.stdin); [print(p['name'], '->', [(t['name'], t['kind']) for t in p['targets']]) for p in d['packages']]\" || true

              echo '=== Building (bins + examples) ==='
              cargo build --release --bins --examples \
                --features build-mnn-from-source || \
              cargo build --release --bins --examples \
                --features build-mnn-from-source,mnn || \
              cargo build --release || true

              echo '=== target/release contents ==='
              ls -la target/release/ || true

              mkdir -p /workspace/artifacts/paddleocr

              # Собираем ВСЁ исполняемое из target, кроме мусора
              find target -type f -executable \
                -not -path '*/build/*' \
                -not -path '*/incremental/*' \
                -not -path '*/.fingerprint/*' \
                -not -name '*.so' \
                -not -name '*.dylib' \
                -not -name '*.rlib' \
                -not -name '*.rmeta' \
                -not -name '*.d' \
                -exec cp --parents {} /workspace/artifacts/paddleocr/ \; 2>/dev/null || true

              # Плюс .so-библиотеки (могут пригодиться)
              find target -type f -name '*.so' \
                -not -path '*/build/*' \
                -exec cp --parents {} /workspace/artifacts/paddleocr/ \; 2>/dev/null || true

              echo '--- paddleocr artifacts ---'
              find /workspace/artifacts/paddleocr -type f | head -80
            "

      # ---------- проверка ----------
      - name: Verify binaries
        run: |
          echo '=== Architecture ==='
          uname -m
          echo
          echo '=== slimt ==='
          find artifacts/slimt -type f -exec file {} \; 2>/dev/null | head -30 || true
          echo
          echo '=== paddleocr ==='
          find artifacts/paddleocr -type f -exec file {} \; 2>/dev/null | head -50 || true

      # ---------- артефакты ----------
      - name: Upload slimt artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-slimt
          path: artifacts/slimt/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload paddleocr artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-paddleocr
          path: artifacts/paddleocr/
          retention-days: 30
          if-no-files-found: warn
