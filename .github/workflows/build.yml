name: Build ARM64 (slimt + PaddleOCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- slimt ----------
      - name: Build slimt (ARM64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:22.04 \
            /bin/bash -c "
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git wget pkg-config ninja-build \
                libopenblas-dev libxsimd-dev xtl-dev libsentencepiece-dev libpcre2-dev \
                libboost-all-dev libprotobuf-dev protobuf-compiler \
                libopencv-dev \
                curl ca-certificates \
                python3 python3-pip \
                libssl-dev

              git clone --recursive https://github.com/jerinphilip/slimt.git
              cd slimt
              mkdir -p build && cd build

              cmake .. \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_RUY=ON \
                -DWITH_GEMMOLOGY=OFF \
                -DWITH_INTGEMM=OFF \
                -DUSE_NEON=ON \
                -DUSE_BUILTIN_SENTENCEPIECE=ON \
                -DBLA_VENDOR=OpenBLAS

              make -j\$(nproc)

              mkdir -p /workspace/artifacts/slimt
              find . -maxdepth 3 -type f -executable -name 'slimt*' \
                -exec cp {} /workspace/artifacts/slimt/ \;

              echo '--- slimt artifacts ---'
              ls -la /workspace/artifacts/slimt/
            "

      # ---------- rust-paddle-ocr ----------
      - name: Cache Rust (arm64)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            rust-paddle-ocr/target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Build PaddleOCR (ARM64)
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -v $HOME/.cargo:/root/.cargo \
            -w /workspace \
            ubuntu:22.04 \
            /bin/bash -c "
              set -euo pipefail

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y \
                build-essential cmake git wget pkg-config ninja-build \
                libopenblas-dev libxsimd-dev xtl-dev libsentencepiece-dev libpcre2-dev \
                libboost-all-dev libprotobuf-dev protobuf-compiler \
                libopencv-dev \
                curl ca-certificates \
                python3 python3-pip \
                libssl-dev

              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain stable --profile minimal
              source \$HOME/.cargo/env

              git clone https://github.com/zibo-chen/rust-paddle-ocr.git
              cd rust-paddle-ocr

              cargo build --release --features build-mnn-from-source

              mkdir -p /workspace/artifacts/paddleocr
              find target/release -maxdepth 1 -type f -executable \
                -exec cp {} /workspace/artifacts/paddleocr/ \;

              echo '--- paddleocr artifacts ---'
              ls -la /workspace/artifacts/paddleocr/
            "

      # ---------- проверка ----------
      - name: Verify binaries
        run: |
          echo '=== Architecture check ==='
          uname -m
          echo
          echo '=== slimt ==='
          ls -la artifacts/slimt/ || true
          file artifacts/slimt/* || true
          echo
          echo '=== paddleocr ==='
          ls -la artifacts/paddleocr/ || true
          file artifacts/paddleocr/* || true

      # ---------- артефакты ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-binaries
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
